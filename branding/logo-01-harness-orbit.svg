<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbit-blue" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#679EFE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="whale-body" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#679EFE"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ring-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#679EFE" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Orbit Arc (Back) -->
  <path d="M 22 62 C 14 50 20 34 38 25 C 56 16 78 18 90 30" 
        stroke="url(#ring-back)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Whale Main Body & Graceful Leap -->
  <path d="M 20 62 
           C 18 46 30 32 46 30 
           C 62 28 76 36 84 46 
           C 80 50 72 52 64 50 
           C 52 47 42 53 36 61 
           C 30 69 22 72 20 62 Z" 
        fill="url(#whale-body)"/>

  <!-- Fluke / Tail Fin -->
  <path d="M 80 44 
           C 85 35 91 29 95 27 
           C 93 37 89 44 85 49 
           C 87 54 92 60 96 64 
           C 90 61 84 54 80 47 Z" 
        fill="url(#orbit-blue)"/>

  <!-- Foreground Harness Ring (Front crossing over body) -->
  <path d="M 90 30 C 96 38 94 54 78 65 C 60 77 36 76 22 62" 
        stroke="url(#orbit-blue)" stroke-width="5.5" stroke-linecap="round" fill="none" filter="url(#soft-glow)"/>

  <!-- Core Sync Beacon / Link Pulse -->
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="6.5" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>
</svg>
