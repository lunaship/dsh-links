# Control-only container configuration. The host publishes 8080 exclusively on
# 127.0.0.1; Relay is attached to a different Docker network.
admin_listen = "0.0.0.0:8080"
admin_allow_non_loopback = true
# 管理面 TLS 与数据面 TLS 复用同一张 relay 证书（见 docker-compose.yml 的
# relay-certificate config）：它们都挂在容器的这个路径上。
admin_tls_cert = "/etc/dsh-links-relay/relay.crt"
admin_tls_key = "/run/secrets/admin-tls-key"
# 数据面证书：仅用于生成接入串的 TLS 指纹与 public_host 兜底。
tls_cert = "/etc/dsh-links-relay/relay.crt"
control_socket = "/run/dsh-links-relay/control.sock"
ipc_auth_token_file = "/run/secrets/ipc-auth"

issuer_private_key = "/run/secrets/issuer-private"
route_master_key = "/run/secrets/route-master"
admin_token_file = "/run/secrets/admin-token"
admin_password_file = "/run/secrets/admin-password"
admin_user = "admin"

database = "/var/lib/dsh-links-relay/control.db"
default_max_streams_per_route = 8
tenant_max_live_hosts = 8
tenant_max_unused_invites = 4
# 公网域名（插件拨号 8444 的 Agent TLS 主机名）。两者都不填时控制台
# 只有裸邀请码，无法生成完整接入串与二维码；docker-compose 可用环境变量注入：
#   DSH_RELAY_PUBLIC_HOST=relay.example.com docker compose up -d
# 或在此取消注释直接填写。
# public_host = "relay.example.com"
# HTTPS 控制台地址（租户打开的反代 URL，指向本机 127.0.0.1:8080）。
# 不是数据面 public_host，也不是 App 登录。自建留空。
# public_control_url = "https://control.example.com"
