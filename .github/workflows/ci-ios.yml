name: CI iOS

on:
  pull_request:
    branches: [ios/main, main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ci-ios.yml'
      - 'scripts/check-ios-locales.mjs'
      - 'scripts/check-ios-locales.test.mjs'
  push:
    branches: [ios/main, main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ci-ios.yml'
      - 'scripts/check-ios-locales.mjs'
      - 'scripts/check-ios-locales.test.mjs'

permissions:
  contents: read

concurrency:
  group: dsh-links-ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check locale catalogs
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/check-ios-locales.mjs
          node --test scripts/check-ios-locales.test.mjs

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install tools
        run: brew install xcodegen swift-format

      - name: Check formatting
        run: swift-format lint --strict --recursive --configuration .swift-format .

      - name: Generate project
        run: xcodegen generate

      - name: Build Debug and Release
        run: |
          set -eu
          for config in Debug Release; do
            xcodebuild \
              -scheme DeepLinks \
              -destination 'generic/platform=iOS Simulator' \
              -configuration "$config" \
              build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          done

  test:
    name: iOS unit tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -eu
          DEST=$(sh scripts/simulator-destination.sh)
          xcodebuild \
            -scheme DeepLinks \
            -destination "$DEST" \
            -only-testing:DeepLinksTests/ModelsLoadTests \
            -only-testing:DeepLinksTests/TokenUsageTests \
            -only-testing:DeepLinksTests/DemoFixturesTests \
            -only-testing:DeepLinksTests/ContextInjectionContractTests \
            -only-testing:DeepLinksTests/MobileModelsContractTests \
            -only-testing:DeepLinksTests/MobileContractFixturesTests \
            -only-testing:DeepLinksTests/HostStoreContractTests \
            -only-testing:DeepLinksTests/TLSFingerprintContractTests \
            -only-testing:DeepLinksTests/SSEClientContractTests \
            -only-testing:DeepLinksTests/HostClientContractTests \
            -only-testing:DeepLinksTests/RequestStateContractTests \
            -only-testing:DeepLinksTests/RouteSelectorContractTests \
            -only-testing:DeepLinksTests/PairingContractTests \
            -only-testing:DeepLinksTests/PairingFlowTests \
            -only-testing:DeepLinksTests/PairingFailureTests \
            -only-testing:DeepLinksTests/PairingPhotoDecoderTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  screenshots:
    name: iOS screenshot check
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Compare screenshot baselines
        run: |
          set -eu
          DEST=$(sh scripts/simulator-destination.sh)
          xcodebuild \
            -scheme DeepLinks \
            -destination "$DEST" \
            -skip-testing:DeepLinksTests/ModelsLoadTests \
            -skip-testing:DeepLinksTests/TokenUsageTests \
            -skip-testing:DeepLinksTests/DemoFixturesTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
