name: CI - Android

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - 'testdata/**'
      - 'relay/testdata/**'
      - 'docs/MOBILE_SYNC_CONTRACT.md'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'testdata/**'
      - 'relay/testdata/**'
      - 'docs/MOBILE_SYNC_CONTRACT.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'apps/android/**/*.gradle*'

      - name: Set up Node.js for conformance check
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Verify DLR/1 vectors
        run: node scripts/check-dlr1-vectors.mjs testdata/dlr1-vectors.json app/src/test/resources/dlr1-vectors.json

      - name: Run JVM tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Validate Compose screenshots
        run: ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check whitespace errors
        run: git diff --check
